<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Read Aloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one centered working column — text sheet on top, a "transport deck" of controls below */
:root {
  --bg: #eef1f4;
  --sheet: #ffffff;
  --fg: #16202b;
  --muted: #5b6878;
  --line: #d3dae2;
  --accent: #1f5fbf;
  --accent-fg: #ffffff;
  --mark: #ffe08a;
  --tint: #dde8fa;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --sheet: #17202a; --fg: #e6ebf1; --muted: #93a0b0;
    --line: #2a3644; --accent: #6ea2f2; --accent-fg: #0b1420; --mark: #6b5a1c; --tint: #22344d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --sheet: #17202a; --fg: #e6ebf1; --muted: #93a0b0;
  --line: #2a3644; --accent: #6ea2f2; --accent-fg: #0b1420; --mark: #6b5a1c; --tint: #22344d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 1rem; line-height: 1.5;
  padding: 0 16px; margin: 0;
}
.wrap { max-width: 44rem; margin: 0 auto; padding-block: 2rem 3rem; display: grid; gap: 1.25rem; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 5vw, 2.4rem); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.status { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 0.5rem; }
.dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--line); }
.status[data-state="speaking"] .dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.status[data-state="paused"] .dot { background: var(--muted); }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .status[data-state="speaking"] .dot { animation: none; } }

.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
textarea {
  display: block; width: 100%; min-height: 14rem; resize: vertical;
  border: 0; outline: none; background: transparent; color: var(--fg);
  font: 1.125rem/1.65 var(--body); padding: 1.25rem;
}
.reader-box { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; }
.reader-head { padding: 0.6rem 1.25rem; border-bottom: 1px solid var(--line); }
.reader-head .lbl { margin: 0; }
.reader { padding: 1.25rem; font-size: 1.125rem; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 22rem; overflow-y: auto; color: var(--muted); }
.reader .empty { font-style: italic; }
.reader .s { border-radius: 4px; transition: background-color 0.15s, color 0.15s; }
.reader .s.done { color: var(--fg); }
.reader .s.cur { background: var(--tint); color: var(--fg); box-shadow: 0 0 0 2px var(--tint); }
.reader mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
@media (prefers-reduced-motion: reduce) { .reader .s { transition: none; } }
.sheet-foot { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 0.6rem 1.25rem; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.linkish { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 0; }

.deck { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 1rem; }
label, .lbl { display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.35rem; }
select {
  width: 100%; font: 1rem var(--body); color: var(--fg); background: var(--sheet);
  border: 1px solid var(--line); border-radius: 10px; padding: 0.6rem 0.75rem;
}
.range-row { display: flex; align-items: center; gap: 0.75rem; }
input[type="range"] { flex: 1; accent-color: var(--accent); min-width: 0; }
.val { font-variant-numeric: tabular-nums; min-width: 3.2ch; text-align: right; font-size: 0.9rem; }

.transport { display: flex; gap: 0.75rem; flex-wrap: wrap; }
button.btn {
  font: 700 1rem var(--body); border-radius: 999px; padding: 0.75rem 1.4rem; cursor: pointer;
  border: 1px solid var(--line); background: var(--sheet); color: var(--fg);
  display: inline-flex; align-items: center; gap: 0.5rem;
}
button.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); flex: 1; justify-content: center; min-width: 9rem; }
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn svg { width: 1rem; height: 1rem; fill: currentColor; }
.switch { display: flex; align-items: flex-start; gap: 0.85rem; cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 1rem; color: var(--fg); margin: 0; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { flex: none; width: 2.6rem; height: 1.5rem; border-radius: 999px; background: var(--line); position: relative; transition: background-color 0.15s; margin-top: 0.1rem; }
.switch .track::after { content: ""; position: absolute; top: 0.2rem; left: 0.2rem; width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--sheet); box-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: transform 0.15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(1.1rem); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch-text { display: grid; gap: 0.15rem; min-width: 0; }
.switch-text span { font-size: 0.85rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .switch .track, .switch .track::after { transition: none; } }
.note { font-size: 0.85rem; color: var(--muted); margin: 0; }
.note[data-kind="warn"] { color: var(--fg); background: var(--mark); padding: 0.6rem 0.8rem; border-radius: 10px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Read Aloud</h1>
    <div class="status" id="status" data-state="idle"><span class="dot"></span><span id="statusText">Ready</span></div>
  </header>

  <div class="sheet">
    <textarea id="text" aria-label="Text to read" placeholder="Paste or type text here…"></textarea>
    <div class="sheet-foot">
      <span id="count">0 words</span>
      <span><button class="linkish" id="paste" type="button">Clear</button></span>
    </div>
  </div>

  <section class="reader-box" aria-label="Now reading">
    <div class="reader-head"><p class="lbl">Now reading</p></div>
    <div class="reader" id="reader" aria-live="off"></div>
  </section>

  <div class="deck">
    <div>
      <label for="lang">Language</label>
      <select id="lang"></select>
    </div>
    <div>
      <label for="voice">Voice</label>
      <select id="voice"></select>
    </div>
    <div>
      <label for="rate">Speed</label>
      <div class="range-row"><input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="1" autocomplete="off"><span class="val" id="rateVal">1×</span></div>
    </div>
    <div>
      <label for="pitch">Pitch</label>
      <div class="range-row"><input type="range" id="pitch" min="0.5" max="1.5" step="0.1" value="1" autocomplete="off"><span class="val" id="pitchVal">1</span></div>
    </div>
  </div>

  <label class="switch" for="expressive">
    <input type="checkbox" id="expressive" checked>
    <span class="track" aria-hidden="true"></span>
    <span class="switch-text"><strong>Expressive reading</strong><span>Livelier tone for questions and exclamations, softer asides, and natural pauses between sentences and paragraphs.</span></span>
  </label>

  <div class="transport">
    <button class="btn primary" id="play" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg><span id="playLbl">Read aloud</span>
    </button>
    <button class="btn" id="stop" type="button" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/></svg>Stop
    </button>
  </div>

  <p class="note" id="note">Uses the voices built into your device and browser, so the list differs between phone and computer.</p>
</div>

<script>
const synth = window.speechSynthesis;
const $ = id => document.getElementById(id);
const textEl = $("text"), reader = $("reader"), langSel = $("lang"), voiceSel = $("voice");
const rate = $("rate"), pitch = $("pitch"), playBtn = $("play"), stopBtn = $("stop");

const SAMPLES = {
  en: "The quick brown fox jumps over the lazy dog. Paste any text here, pick a language, and press Read aloud.",
  de: "Zwölf Boxkämpfer jagen Viktor quer über den großen Sylter Deich. Füge hier einen beliebigen Text ein, wähle eine Sprache und tippe auf Vorlesen.",
  fr: "Portez ce vieux whisky au juge blond qui fume. Collez un texte ici, choisissez une langue et appuyez sur Lire.",
  es: "El veloz murciélago hindú comía feliz cardillo y kiwi. Pega aquí cualquier texto, elige un idioma y pulsa Leer.",
  it: "Quel vituperabile xenofobo zelante assaggia il whisky ed esclama alleluja. Incolla un testo, scegli una lingua e premi Leggi.",
  nl: "Pa's wijze lynx bezag vroom het fikse aquaduct. Plak hier een tekst, kies een taal en druk op Voorlezen.",
  pt: "Luís argüia à Júlia que «brações, fé, chá, óxido, pôr, zângão» eram palavras do português.",
  pl: "Pchnąć w tę łódź jeża lub ośm skrzyń fig.",
  ja: "いろはにほへと ちりぬるを わかよたれそ つねならむ。",
  zh: "我能吞下玻璃而不伤身体。"
};
const FALLBACK_LANGS = ["en-US","en-GB","de-DE","de-AT","fr-FR","es-ES","it-IT","nl-NL","pt-BR","pl-PL","ru-RU","tr-TR","ja-JP","zh-CN","ko-KR","ar-SA","hi-IN"];

let names;
try { names = new Intl.DisplayNames([navigator.language || "en"], { type: "language" }); } catch (e) { names = null; }
const langName = code => { try { return names ? names.of(code) : code; } catch (e) { return code; } };
const base = code => code.split(/[-_]/)[0].toLowerCase();
const norm = code => code.replace("_", "-");

let voices = [];
let currentSample = null;

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function buildLanguages() {
  voices = synth ? synth.getVoices() : [];
  const codes = new Set(voices.map(v => norm(v.lang)).filter(Boolean));
  const list = codes.size ? [...codes] : FALLBACK_LANGS;
  list.sort((a, b) => langName(a).localeCompare(langName(b)));
  const prev = langSel.value || load("lang") || norm(navigator.language || "en-US");
  langSel.innerHTML = list.map(c => `<option value="${c}">${langName(c)}</option>`).join("");
  const exact = list.find(c => c.toLowerCase() === prev.toLowerCase());
  const loose = list.find(c => base(c) === base(prev));
  langSel.value = exact || loose || list[0];
  buildVoices();
  if (!codes.size && synth) note("No voices reported yet. Reading may still work with your device's default voice.", true);
}

function buildVoices() {
  const lang = langSel.value;
  let matches = voices.filter(v => norm(v.lang).toLowerCase() === lang.toLowerCase());
  if (!matches.length) matches = voices.filter(v => base(v.lang) === base(lang));
  matches.sort((a, b) => (b.localService - a.localService) || a.name.localeCompare(b.name));
  if (!matches.length) {
    voiceSel.innerHTML = `<option value="">Device default</option>`;
  } else {
    voiceSel.innerHTML = matches.map(v => `<option value="${v.voiceURI}">${v.name}${v.localService ? "" : " (online)"}</option>`).join("");
    const saved = load("voice:" + lang);
    if (saved && matches.some(v => v.voiceURI === saved)) voiceSel.value = saved;
  }
  swapSample();
}

function swapSample() {
  const b = base(langSel.value);
  const isSample = !textEl.value.trim() || Object.values(SAMPLES).includes(textEl.value);
  if (isSample && SAMPLES[b]) { textEl.value = SAMPLES[b]; }
  updateCount();
}

function updateCount() {
  const t = textEl.value.trim();
  const words = t ? t.split(/\s+/).length : 0;
  const mins = words / (150 * Number(rate.value));
  const est = words ? ` · about ${mins < 1 ? Math.max(1, Math.round(mins * 60)) + " s" : Math.round(mins) + " min"}` : "";
  $("count").textContent = `${words} word${words === 1 ? "" : "s"} · ${t.length} characters${est}`;
  if ($("status").dataset.state === "idle") renderReader(textEl.value);
}

function note(msg, warn) { const n = $("note"); n.textContent = msg; n.dataset.kind = warn ? "warn" : ""; }

function setState(s) {
  $("status").dataset.state = s;
  $("statusText").textContent = { idle: "Ready", speaking: "Reading", paused: "Paused" }[s];
  $("playLbl").textContent = s === "speaking" ? "Pause" : s === "paused" ? "Resume" : "Read aloud";
  playBtn.querySelector("path").setAttribute("d", s === "speaking" ? "M4 2.5h3v11H4zM9 2.5h3v11H9z" : "M4 2.5v11l9-5.5z");
  stopBtn.disabled = s === "idle";
  textEl.readOnly = s !== "idle";
}

function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

// Split text into sentences, keeping each one's position in the original text.
function sentences(text, lang) {
  const out = [];
  try {
    const seg = new Intl.Segmenter(lang, { granularity: "sentence" });
    for (const p of seg.segment(text)) out.push({ start: p.index, text: p.segment });
  } catch (e) {
    const re = /[^.!?。！？\n]+[.!?。！？]*[\s]*|\n+/g; let m;
    while ((m = re.exec(text))) out.push({ start: m.index, text: m[0] });
  }
  return out.length ? out : [{ start: 0, text }];
}

let parts = [], session = 0, current = -1;

function renderReader(text) {
  parts = sentences(text, langSel.value);
  if (!text.trim()) { reader.innerHTML = '<span class="empty">The text appears here while it is read, with the current sentence and word highlighted.</span>'; return; }
  reader.innerHTML = parts.map((p, i) => `<span class="s" data-i="${i}">${esc(p.text)}</span>`).join("");
}

function sentenceEl(i) { return reader.querySelector(`.s[data-i="${i}"]`); }

function markSentence(i) {
  reader.querySelectorAll(".s").forEach(el => {
    const k = Number(el.dataset.i);
    el.classList.toggle("done", k < i);
    el.classList.toggle("cur", k === i);
    if (k !== i && el.querySelector("mark")) el.textContent = parts[k].text;
  });
  const el = sentenceEl(i);
  if (el) scrollInto(el);
}

function markWord(i, offset, len) {
  const el = sentenceEl(i); if (!el) return;
  const t = parts[i].text;
  if (!len) { const m = t.slice(offset).match(/^\S+/); len = m ? m[0].length : 0; }
  if (!len) return;
  el.innerHTML = esc(t.slice(0, offset)) + "<mark>" + esc(t.slice(offset, offset + len)) + "</mark>" + esc(t.slice(offset + len));
}

function scrollInto(el) {
  const r = reader.getBoundingClientRect(), e = el.getBoundingClientRect();
  if (e.top < r.top || e.bottom > r.bottom) reader.scrollTop += e.top - r.top - 16;
}

function finish() {
  current = -1;
  setState("idle");
  reader.querySelectorAll(".s").forEach(el => { el.classList.remove("cur", "done"); el.textContent = parts[el.dataset.i].text; });
}

const expressiveEl = $("expressive");
let pending = null, pauseTimer = null;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// Expressive mode: shape pace, pitch, volume and the pause after each sentence from its punctuation.
function toneFor(i) {
  const raw = parts[i].text;
  const t = raw.trim();
  const prev = i > 0 ? parts[i - 1].text : "\n";
  const t0 = { rate: 1, pitch: 1, volume: 1, pause: 220 };
  const paraStart = /\n\s*$/.test(prev);
  const paraEnd = /\n/.test(raw.slice(raw.trimEnd().length)) || i === parts.length - 1;
  const words = t.split(/\s+/).length;

  if (/[?？]["'”»)]*$/.test(t)) { t0.pitch *= 1.14; t0.rate *= 0.97; t0.pause = 380; }
  else if (/[!！]["'”»)]*$/.test(t)) { t0.pitch *= 1.12; t0.rate *= 1.08; t0.pause = 320; }
  else if (/(\.\.\.|…)["'”»)]*$/.test(t)) { t0.pitch *= 0.94; t0.rate *= 0.86; t0.pause = 650; }
  else if (/[:;—–]$/.test(t)) { t0.pause = 300; }

  if (/^[„"“«'‚‹]/.test(t)) { t0.pitch *= 1.07; t0.rate *= 1.03; }          // dialogue
  if (/^\(.*\)$/.test(t)) { t0.pitch *= 0.92; t0.rate *= 1.05; t0.volume = 0.8; } // aside
  if (/\b[A-ZÄÖÜ]{3,}\b/.test(t)) { t0.rate *= 0.95; t0.volume = 1; }        // SHOUTED words
  if (paraStart) t0.rate *= 0.96;                                            // settle into a new paragraph
  if (words <= 4) t0.rate *= 0.94;                                           // short punchy lines land slower
  if (paraEnd) t0.pause = Math.max(t0.pause, 700);

  // a little natural variation so consecutive sentences don't sound identical
  const jitter = ((i * 37) % 7 - 3) / 100;
  t0.pitch *= 1 + jitter;
  return t0;
}

function speakFrom(i, id) {
  if (id !== session) return;
  while (i < parts.length && !parts[i].text.trim()) i++;
  if (i >= parts.length) { finish(); return; }
  current = i;
  markSentence(i);
  const u = new SpeechSynthesisUtterance(parts[i].text);
  u.lang = langSel.value;
  const v = voices.find(v => v.voiceURI === voiceSel.value);
  if (v) u.voice = v;
  const tone = expressiveEl.checked ? toneFor(i) : { rate: 1, pitch: 1, volume: 1, pause: 0 };
  u.rate = clamp(Number(rate.value) * tone.rate, 0.1, 4);
  u.pitch = clamp(Number(pitch.value) * tone.pitch, 0, 2);
  u.volume = tone.volume;
  u.onboundary = e => { if (id === session && (e.name === "word" || e.name === undefined)) markWord(i, e.charIndex, e.charLength); };
  u.onend = () => {
    if (id !== session) return;
    if (!tone.pause) { speakFrom(i + 1, id); return; }
    pending = { i: i + 1, id };
    pauseTimer = setTimeout(() => { pauseTimer = null; if ($("status").dataset.state === "speaking") { pending = null; speakFrom(i + 1, id); } }, tone.pause / Number(rate.value));
  };
  u.onerror = e => {
    if (id !== session) return;
    if (e.error === "interrupted" || e.error === "canceled") return;
    finish();
    note(`Couldn't read the text (${e.error}). Try another voice or language.`, true);
  };
  synth.speak(u);
}

function speak() {
  const text = textEl.value;
  if (!text.trim()) { note("Paste some text first.", true); textEl.focus(); return; }
  session++;
  synth.cancel();
  renderReader(text);
  setState("speaking");
  note("Uses the voices built into your device and browser, so the list differs between phone and computer.");
  const id = session;
  setTimeout(() => speakFrom(0, id), 50);
}

function stop() { session++; clearTimeout(pauseTimer); pauseTimer = null; pending = null; synth.cancel(); finish(); }

playBtn.addEventListener("click", () => {
  if (!synth) return;
  const s = $("status").dataset.state;
  if (s === "speaking") { synth.pause(); setState("paused"); }
  else if (s === "paused") {
    setState("speaking");
    if (pending && !pauseTimer) { const p = pending; pending = null; speakFrom(p.i, p.id); }
    else synth.resume();
  }
  else speak();
});
expressiveEl.addEventListener("change", () => store("expressive", expressiveEl.checked ? "1" : "0"));
if (load("expressive") === "0") expressiveEl.checked = false;
stopBtn.addEventListener("click", stop);
$("paste").addEventListener("click", () => { if (synth) stop(); textEl.value = ""; updateCount(); textEl.focus(); });
textEl.addEventListener("input", updateCount);
langSel.addEventListener("change", () => { store("lang", langSel.value); if (synth) stop(); buildVoices(); });
voiceSel.addEventListener("change", () => store("voice:" + langSel.value, voiceSel.value));
const fmt = v => String(Number(Number(v).toFixed(1)));
rate.addEventListener("input", () => { $("rateVal").textContent = fmt(rate.value) + "×"; updateCount(); });
pitch.addEventListener("input", () => { $("pitchVal").textContent = fmt(pitch.value); });

// Always start at normal speed and pitch, even if the browser restored old slider positions.
rate.value = 1; pitch.value = 1;

if (!synth || typeof SpeechSynthesisUtterance === "undefined") {
  playBtn.disabled = true;
  note("This browser doesn't support speech. Try a current Chrome, Safari, Edge or Firefox.", true);
  buildLanguages();
} else {
  buildLanguages();
  if ("onvoiceschanged" in synth) synth.addEventListener("voiceschanged", buildLanguages);
  setTimeout(() => { if (!voices.length) buildLanguages(); }, 800);
}
window.addEventListener("pagehide", () => { session++; synth && synth.cancel(); });
</script>
</body>
</html>
