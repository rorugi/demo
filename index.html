<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
:root{
  --bg:#eceee9; --fg:#1c2321; --muted:#5d6762; --line:#d3d8d2; --panel:#f7f8f5;
  --slate:#22302e; --chalk:#eef2e9; --accent:#e9a23b;
  --f-deva:"Tiro Devanagari Hindi","Noto Serif Devanagari",serif;
  --f-ui:"Hind","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121716; --fg:#e2e7e3; --muted:#97a19c; --line:#2a3331; --panel:#1a2120; --slate:#1c2826; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.55}
main{max-width:720px;margin:0 auto;padding:48px 16px;display:grid;gap:24px}
h1{margin:0;font-size:clamp(28px,6vw,38px);font-weight:600;line-height:1.15}
p{margin:0;color:var(--muted);max-width:60ch}
.card{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;text-decoration:none;color:inherit;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.thumb{width:96px;height:96px;border-radius:10px;background:var(--slate);display:grid;place-items:center;
  font-family:var(--f-deva);font-size:56px;color:var(--chalk);line-height:1}
.card h2{margin:0 0 4px;font-size:19px;font-weight:600}
.card p{font-size:15px}
.go{display:inline-block;margin-top:8px;color:var(--accent);font-weight:600;font-size:14px}
@media (max-width:420px){.card{grid-template-columns:1fr}.thumb{width:100%;height:120px}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Demos</h1>
    <p>Kleine Experimente im Browser.</p>
  </header>

  <a class="card" href="devanagari-breitfeder.html">
    <div class="thumb" aria-hidden="true">क्री</div>
    <div>
      <h2>Devanagari mit Breitfeder</h2>
      <p>Animierte Schreibreihenfolge von Devanagari-Zeichen, gezeichnet mit einem flachen Pinsel im einstellbaren Winkel auf einem Raster mit vier Zonen.</p>
      <span class="go">Öffnen →</span>
    </div>
  </a>
</main>
</body>
</html>
