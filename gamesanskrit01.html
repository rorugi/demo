<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanskrit Roguelike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --font-sans:'Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:8px;
  --page:#F7F6F3;--surface-1:#F1EFE8;--surface-2:#FFFFFF;
  --text-primary:#1F1E1C;--text-secondary:#5F5E5A;--text-muted:#9A988F;
  --border:rgba(0,0,0,.10);--border-strong:rgba(0,0,0,.18);--border-stronger:rgba(0,0,0,.40);
  --fill-control-hover:#D3D1C7;
  --bg-accent:#E6F1FB;--text-accent:#185FA5;--border-accent:#378ADD;
  --bg-pro:#EEEDFE;--text-pro:#534AB7;
  --bg-success:#EAF3DE;--text-success:#3B6D11;
  --bg-danger:#FCEBEB;--text-danger:#A32D2D;--border-danger:#E24B4A;
  --bg-warning:#FAEEDA;--text-warning:#854F0B;
  --water-fg:#0C447C;--water-bg:#B5D4F4;
}
@media (prefers-color-scheme:dark){:root{
  --page:#1A1A19;--surface-1:#262624;--surface-2:#2C2C2A;
  --text-primary:#EEEDE8;--text-secondary:#B4B2A9;--text-muted:#7A7973;
  --border:rgba(255,255,255,.10);--border-strong:rgba(255,255,255,.18);--border-stronger:rgba(255,255,255,.40);
  --fill-control-hover:#444441;
  --bg-accent:#0C447C;--text-accent:#B5D4F4;--border-accent:#85B7EB;
  --bg-pro:#3C3489;--text-pro:#CECBF6;
  --bg-success:#27500A;--text-success:#C0DD97;
  --bg-danger:#791F1F;--text-danger:#F7C1C1;--border-danger:#F09595;
  --bg-warning:#633806;--text-warning:#FAC775;
  --water-fg:#B5D4F4;--water-bg:#0C447C;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text-primary);font-family:var(--font-sans);font-size:16px;line-height:1.5}
main{max-width:420px;margin:0 auto;padding:16px}
h1{font-size:18px;font-weight:500;margin:0 0 8px}
button,select{font:inherit;color:var(--text-primary);background:transparent;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
button:hover{background:var(--surface-1)}
button:active{transform:scale(.98)}
select{background:var(--surface-2);padding:6px 8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dev{font-family:'Noto Sans Devanagari',var(--font-sans)}
#map{display:grid;grid-template-columns:repeat(15,24px);grid-template-rows:repeat(13,28px);justify-content:center;font-family:'Noto Sans Devanagari',var(--font-sans);margin:0.5rem 0;overflow:hidden;user-select:none}
.c{display:flex;align-items:center;justify-content:center;line-height:1;white-space:nowrap;overflow:hidden}
.c span{display:inline-block}
.w{background:var(--fill-control-hover);color:var(--text-secondary);font-size:13px;border:0.5px solid var(--border-strong);cursor:pointer}
.f{color:var(--text-muted);font-size:11px;cursor:pointer}
.tg{color:var(--text-accent);font-size:14px}
.ent{font-size:15px;border-radius:6px;margin:1px;cursor:pointer;z-index:1;position:relative}
.ent::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,transparent calc(100% - 0.5px),var(--border-strong) 0);background-size:24px 100%;opacity:.5;border-radius:6px}
.pl{color:var(--text-accent);background:var(--bg-accent);font-weight:500;z-index:3;border:1px solid var(--border-accent)}
.it{color:var(--text-pro);background:var(--bg-pro)}
.tr{color:#27500A;background:#C0DD97;font-size:14px}
@media (prefers-color-scheme:dark){.tr{color:#EAF3DE;background:#3B6D11}}
.ent.tr,.ent.tr::after{border-radius:12px}
.wd{background:var(--bg-success);color:var(--text-success);font-size:14px}
.ent.wd,.ent.wd::after{border-radius:0}
.ent.wd{margin:0}
.en{color:var(--text-danger);background:var(--bg-danger)}
.hz{color:var(--text-warning);background:var(--bg-warning)}
.ex{color:var(--text-primary);background:var(--surface-1);border:0.5px solid var(--border-stronger)}
.ch{background:#D85A30;color:#000;font-weight:500}
.ch.ok{color:#fff}
.wa{color:var(--water-fg);background:var(--water-bg)}
.ent.gold{background:#EF9F27;color:#412402}
.ent.jewel{background:#FFF8E1;color:#854F0B;box-shadow:inset 0 0 0 0.5px #FAC775}
.np{background:#E1F5EE;color:#085041}
@media (prefers-color-scheme:dark){.np{background:#085041;color:#9FE1CB}}
.np span{animation:live 3.4s ease-in-out infinite}
.lp{background:#412402;color:#FAC775}
.lp span{animation:glow 1.3s ease-in-out infinite}
@keyframes glow{0%,100%{text-shadow:0 0 2px #EF9F27;transform:translateY(0)}30%{text-shadow:0 0 7px #FAC775,0 0 12px #EF9F27;transform:translateY(-1px)}60%{text-shadow:0 0 4px #EF9F27;transform:translateY(0) scale(1.03)}}
.ent.divine{background:linear-gradient(110deg,#FAEEDA 0%,#FAEEDA 38%,#FFFDF4 50%,#FAEEDA 62%,#FAEEDA 100%);background-size:260% 100%;color:#854F0B;animation:shine 2.4s linear infinite;animation-delay:var(--dl,0s)}
@media (prefers-color-scheme:dark){.ent.divine{background-image:linear-gradient(110deg,#633806 0%,#633806 38%,#BA7517 50%,#633806 62%,#633806 100%);color:#FAEEDA}}
.ent.divine::before{content:'✦';position:absolute;top:0;right:3px;font-size:9px;line-height:1;color:#EF9F27;animation:twinkle 1.7s ease-in-out infinite;animation-delay:var(--dl,0s);pointer-events:none}
.ent.divine span::after{content:'✧';position:absolute;bottom:1px;left:3px;font-size:8px;color:#EF9F27;animation:twinkle 2.3s ease-in-out infinite;animation-delay:calc(var(--dl,0s) - 0.8s)}
@keyframes shine{0%{background-position:130% 0}100%{background-position:-130% 0}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
.dr{background:#E24B4A;color:#fff;font-weight:500}
.dr.open{opacity:.45}
.st{background:#B4B2A9;color:#000;font-weight:500}
.ent.st,.ent.st::after,.ent.wa,.ent.wa::after{border-radius:0}
.ent.wa{margin:0}
.st.open{background:var(--surface-1);color:var(--text-primary);border:0.5px dashed var(--border-stronger)}
.dw{background:#0C447C;color:#B5D4F4;font-size:14px;cursor:pointer}
@media (prefers-color-scheme:dark){.dw{background:#042C53;color:#85B7EB}}
.dw span{animation:deep 2.1s ease-in-out infinite}
@keyframes deep{0%,100%{transform:rotate(-11deg) translate(-2px,-1px)}25%{transform:rotate(4deg) translate(1px,2px)}50%{transform:rotate(11deg) translate(2px,-1px)}75%{transform:rotate(-4deg) translate(-1px,2px)}}
.ent.unk{color:#000}
.qp{line-height:1.25;padding:4px 10px;text-align:center}
.qp.cur{border:1.5px solid var(--border-accent)}
.qp.done{color:var(--text-success)}
.sg{color:var(--text-secondary);background:var(--surface-2);border:0.5px dashed var(--border-stronger);opacity:.5}
.wa span{animation:flow 3.2s ease-in-out infinite}
.hz span{animation:jit .35s steps(1) infinite}
.en span{animation:live 2.6s ease-in-out infinite}
@keyframes flow{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes jit{0%{transform:translate(0,0)}25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,0)}75%{transform:translate(0,1px) scale(1.04)}}
@keyframes live{0%,100%{transform:translate(0,0)}25%{transform:translate(2px,-1px)}50%{transform:translate(0,1px)}75%{transform:translate(-2px,0)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.c span{animation:none!important}}
.sel{outline:1.5px solid var(--border-stronger);outline-offset:-1.5px}
.qb{font-size:14px;padding:4px 12px;min-width:52px}
.qb.no{color:var(--text-danger);border-color:var(--border-danger)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:var(--radius);border:0.5px solid var(--border-strong);font-size:13px;cursor:pointer;background:var(--surface-2)}
.chip .g{font-size:16px;font-weight:500;color:#D85A30}
.chip.item .g{color:var(--text-pro);font-size:14px}
.chip.fg{border-style:dashed;color:var(--text-muted)}
.chip.fg .g{color:var(--text-muted)}
.chip.pop{animation:pop .35s ease-out}
.fly{position:absolute;z-index:10;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;pointer-events:none;transition:transform .65s cubic-bezier(.5,0,.3,1),opacity .65s;font-family:'Noto Sans Devanagari',var(--font-sans)}
.fly.ch{background:#D85A30;color:#fff}
.fly.it{background:var(--bg-pro);color:var(--text-pro)}
.tw{font-size:12px;padding:2px 8px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.muted{color:var(--text-secondary)}
</style>
</head>
<body>
<main id="root" style="position:relative">
<h1 class="dev">संस्कृत roguelike</h1>
<h2 class="sr-only">A turn-based Sanskrit roguelike. Tap the floor to walk. Tap an item or akṣara to read it and use the Pick up button to put it in the bag.</h2>
<div class="row dev" style="justify-content:space-between;font-size:13px;color:var(--text-secondary)">
<span>अ = अहम् <span id="hp" style="color:var(--text-primary);font-weight:500"></span></span>
<span>Words learned: <span id="sc" style="color:var(--text-primary);font-weight:500">0</span></span>
</div>
<div class="row" style="margin-top:6px;font-size:13px;color:var(--text-secondary)"><i class="ti ti-backpack" style="font-size:18px" aria-hidden="true"></i>Bag</div>
<div id="bag" class="row dev" style="min-height:30px;margin-top:4px"></div>
<div id="map" tabindex="0" aria-label="Game map"></div>
<div id="info" class="dev" style="background:var(--surface-1);border-radius:var(--radius);padding:8px 12px;font-size:13px;min-height:20px"></div>
<div id="log" class="dev" style="margin-top:0.75rem;font-size:13px;line-height:1.6;min-height:84px"></div>
<div class="row" style="font-size:12px;color:var(--text-secondary);margin-top:8px">
<span>Simulate time</span><button class="tw" data-t="300000">+5 min</button><button class="tw" data-t="3600000">+1 h</button><button class="tw" data-t="86400000">+1 d</button><button class="tw" data-t="432000000">+5 d</button>
<button id="rs" style="margin-left:auto;font-size:12px;padding:2px 10px">Restart</button>
</div>
<div class="row" style="font-size:12px;color:var(--text-secondary);margin-top:8px">
<span>Level <span id="lvname" class="dev" style="color:var(--text-primary)"></span></span>
<button id="dl" class="tw" style="margin-left:auto"><i class="ti ti-download" aria-hidden="true"></i> Download level</button>
<label class="tw" style="border:0.5px solid var(--border-strong);border-radius:var(--radius);cursor:pointer"><i class="ti ti-upload" aria-hidden="true"></i> Load level<input id="ld" type="file" accept=".json,application/json" style="display:none"></label>
<button id="bi" class="tw" style="display:none">Built-in level</button>
</div>
<div id="lderr" style="font-size:13px;color:var(--text-danger);min-height:0"></div>
<div class="row" style="gap:8px;margin-top:10px;font-size:13px;color:var(--text-secondary)">
<i class="ti ti-volume" style="font-size:18px" aria-hidden="true"></i><label for="voice">Voice</label>
<select id="voice" style="flex:1;min-width:0"><option value="">Off</option></select>
</div>
<section id="admin" style="margin-top:20px;border-top:0.5px solid var(--border);padding-top:12px">
<div class="row" style="font-size:13px"><span style="font-weight:500">Admin</span><label style="margin-left:auto;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="edon"> Enable editing</label></div>
<div id="edtools" style="display:none;margin-top:8px;font-size:13px">
<div class="row">
<label style="display:flex;align-items:center;gap:4px"><input type="radio" name="edtool" value="draw" checked> <i class="ti ti-pencil" aria-hidden="true"></i> Draw</label>
<label style="display:flex;align-items:center;gap:4px"><input type="radio" name="edtool" value="del"> <i class="ti ti-eraser" aria-hidden="true"></i> Delete</label>
<select id="edtype" class="dev" style="flex:1;min-width:0"></select>
<select id="edletter" class="dev" style="display:none;width:80px"></select>
</div>
<div class="row" style="margin-top:8px"><span class="muted">Move view</span>
<button class="tw" data-pan="-3,0" aria-label="Left"><i class="ti ti-arrow-left"></i></button><button class="tw" data-pan="0,-3" aria-label="Up"><i class="ti ti-arrow-up"></i></button><button class="tw" data-pan="0,3" aria-label="Down"><i class="ti ti-arrow-down"></i></button><button class="tw" data-pan="3,0" aria-label="Right"><i class="ti ti-arrow-right"></i></button>
<span id="edpos" class="muted" style="margin-left:auto;font-size:12px"></span></div>
<div id="edmsg" class="dev muted" style="margin-top:6px;font-size:12px;min-height:18px"></div>
</div>
</section>
</main>

,"k":"wd","t":"vanam","m":"wood, a whole region of trees"},{"g":"वनम्","n":2,"x":27,"y":5,"k":"wd","t":"vanam","m":"wood, a whole region of trees"},{"g":"वनम्","n":2,"x":1,"y":7,"k":"wd","t":"vanam","m":"wood, a whole region of trees"},{"g":"वनम्","n":3,"x":3,"y":7,"k":"wd","t":"vanam","m":"wood, a whole region of trees"},{"g":"वनम्","n":2,"x":1,"y":8,"k":"wd","t":"vanam","m":"wood, a whole region of trees"},{"g":"वनम्","n":3,"x":3,"y":8,"k":"wd","t":"vanam","m":"wood, a whole region of trees"},{"g":"वनम्","n":2,"x":1,"y":9,"k":"wd","t":"vanam","m":"wood, a whole region of trees"},{"g":"वनम्","n":3,"x":3,"y":9,"k":"wd","t":"vanam","m":"wood, a whole region of trees"},{"g":"वनम्","n":2,"x":1,"y":10,"k":"wd","t":"vanam","m":"wood, a whole region of trees"},{"g":"वनम्","n":2,"x":4,"y":10,"k":"wd","t":"vanam","m":"wood, a whole region of trees"},{"g":"वनम्","n":2,"x":1,"y":11,"k":"wd","t":"vanam","m":"wood, a whole region of trees"},{"g":"वनम्","n":3,"x":3,"y":11,"k":"wd","t":"vanam","m":"wood, a whole region of trees"}]}</script>
<script>
const BUILTIN=JSON.parse(document.getElementById('level-data').textContent);
let LV=BUILTIN;
try{const c=localStorage.getItem('skt-rogue-level');if(c)LV=JSON.parse(c);}catch(e){}
let M,W,H,DWB,INT,WALK,WALL,DEEP,POOL,MODP,CONS,MARK,LA,LAT,INFO;
function applyLevel(L){M=L.map.rows.map(r=>r.split(''));H=M.length;W=Math.max(...M.map(r=>r.length));M.forEach(r=>{while(r.length<W)r.push('#');});
computeDWB();
INT=L.review.intervalsMs;WALK=Object.keys(L.kinds).filter(k=>L.kinds[k].walk);WALL=L.terrain.wall;DEEP=L.terrain.deepWater;
POOL=L.quiz.pool;MODP=L.quiz.modifierPool;CONS=L.quiz.consonantRow;MARK=L.quiz.vowelSignRow;LA=L.lookalikes||{};
INFO={};for(const [g,v] of Object.entries(L.letters))INFO[g]={t:v.t,m:v.m,s:v.say||g,grp:v.group,ct:v.consonant,v:v.vowel};
LAT={};Object.keys(LA).forEach(g=>{if(INFO[g])LAT[g]=INFO[g].t;});}
function computeDWB(){DWB={};for(let y=0;y<H;y++){let x=0;while(x<W){if(M[y][x]!=='~'){x++;continue}let e=x;while(M[y][e]==='~')e++;let L2=e-x,a=x;while(L2>0){const n=L2===3?3:L2>=2?2:1;for(let i=0;i<n;i++)DWB[y*W+a+i]=[a,n];a+=n;L2-=n;}x=e;}}}
applyLevel(LV);
const VW=15,VH=13,SHOW_MINI=false;
const DUR={wa:3.2,hz:0.35,en:2.6,np:3.4,lp:1.3};
const VOW=[['अ','a'],['आ','ā'],['इ','i'],['ई','ī'],['उ','u'],['ऊ','ū'],['ऋ','ṛ'],['ॠ','ṝ'],['ऌ','ḷ'],['ॡ','ḹ'],['ए','e'],['ऐ','ai'],['ओ','o'],['औ','au']];
const CONSL='कखगघङचछजझञटठडढणतथदधनपफबभमयरलवशषसह'.split(''),CONST=['k','kh','g','gh','ṅ','c','ch','j','jh','ñ','ṭ','ṭh','ḍ','ḍh','ṇ','t','th','d','dh','n','p','ph','b','bh','m','y','r','l','v','ś','ṣ','s','h'];
const TC={};CONSL.forEach((c,i)=>TC[c]=CONST[i]);const IV={};VOW.forEach(([g,t])=>IV[g]=t);
const MV={'ा':'ā','ि':'i','ी':'ī','ु':'u','ू':'ū','ृ':'ṛ','ॄ':'ṝ','ॢ':'ḷ','ॣ':'ḹ','े':'e','ै':'ai','ो':'o','ौ':'au'},MODM={'ं':'ṃ','ः':'ḥ','ँ':'m̐','ऽ':'’'};
function tr(x){let o='';for(const ch of x){if(TC[ch]!==undefined)o+=TC[ch]+'a';else if(MV[ch]!==undefined)o=o.slice(0,-1)+MV[ch];else if(ch==='्')o=o.slice(0,-1);else if(IV[ch]!==undefined)o+=IV[ch];else if(MODM[ch]!==undefined)o+=MODM[ch];}return o;}
const AKS=/(?:[क-ह](?:्[क-ह])*(?:[ा-ौॢॣ]|्(?![क-ह]))?|[अ-औॠॡ])[ँंः]*|ऽ/g;
function variants(t){const out=new Set(),VV=['a','ā','i','ī','u','ū','ṛ','e','ai','o','au'];const m=t.match(/^(.*?)(ai|au|ā|ī|ū|ṝ|ṛ|ḹ|ḷ|a|i|u|e|o)?((?:m̐|[ḥṃ])?)$/);if(!m)return [];
const hd=m[1],v=m[2]||'',md=m[3];(v?VV:['a','ā','i']).forEach(x=>out.add(hd+x+md));
if(/[kgcjṭḍtdpb]h$/.test(hd))out.add(hd.slice(0,-1)+v+md);else if(/[kgcjṭḍtdpb]$/.test(hd))out.add(hd+'h'+v+md);
const sw={t:'ṭ',ṭ:'t',d:'ḍ',ḍ:'d',n:'ṇ',ṇ:'n',s:'ś',ś:'ṣ',ṣ:'s',r:'l',l:'r',v:'b',b:'v'};if(hd&&sw[hd[0]])out.add(sw[hd[0]]+hd.slice(1)+v+md);
['','ḥ','ṃ'].forEach(x=>out.add(hd+v+x));out.delete(t);return [...out];}
const IINFO={},WINFO={};
let P,E,hp,learned,logs,atk,K={},bag={},warp=0,sel=null,selG=null,walk=null,target=null,quiz=null,voices=[],voiceName='',doors={};
const now=()=>Date.now()+warp;
function load(){learned=new Set();try{const s=JSON.parse(localStorage.getItem('skt-rogue-v2')||'{}');K=s.K||{};bag=s.bag||{};warp=s.warp||0;voiceName=s.voice||'';learned=new Set(s.L||[]);doors=s.D||{};}catch(e){}}
function save(){try{localStorage.setItem('skt-rogue-v2',JSON.stringify({K,bag,warp,voice:voiceName,L:[...learned],D:doors}));}catch(e){}}
const hasTTS='speechSynthesis' in window;
function listVoices(){if(!hasTTS)return;voices=speechSynthesis.getVoices();const pr=v=>/^(sa|hi|mr|ne)/i.test(v.lang)?0:1;
const sorted=voices.slice().sort((a,b)=>pr(a)-pr(b)||a.lang.localeCompare(b.lang)||a.name.localeCompare(b.name));
const s=document.getElementById('voice');s.innerHTML='<option value="">Off</option>'+(sorted.length?sorted.map(v=>'<option value="'+v.name.replace(/"/g,'&quot;')+'">'+v.name+' ('+v.lang+')</option>').join(''):'<option disabled>No voices available</option>');
if(voices.some(v=>v.name===voiceName))s.value=voiceName;else{s.value='';}}
function speak(text){if(!hasTTS||!voiceName||!text)return;const v=voices.find(x=>x.name===voiceName);if(!v)return;
speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=0.85;speechSynthesis.speak(u);}
const sayOf=e=>(e.k==='ch'||e.k==='st')?INFO[e.g].s:e.full;
const knownE=e=>e===P?true:(e===WALL||e===DEEP)?learned.has(e.t):active(e.g);
function speakIfKnown(e){if(knownE(e))speak(sayOf(e));}
const kn=g=>K[g]||(K[g]={level:0,due:0});
const active=g=>kn(g).due>now();
function fmt(ms){const m=ms/60000;if(m<60)return Math.max(1,Math.round(m))+' min';const h=m/60;if(h<24)return Math.round(h)+' h';return Math.round(h/24)+' d';}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function init(){stopWalk();quiz=null;selG=null;
P={...LV.player,n:1,k:'pl',x:LV.start.x,y:LV.start.y};
E=JSON.parse(JSON.stringify(LV.entities));for(const k in IINFO)delete IINFO[k];for(const k in WINFO)delete WINFO[k];
E.forEach(e=>{e.full=e.full||e.g;if(e.k==='it')IINFO[e.g]={t:e.t,m:e.m};});
E.forEach(e=>{if(e.k!=='ch'&&e.k!=='st')WINFO[e.g]={t:e.t,m:e.m};});
hp=6;atk=1;logs=[];sel=P;
say(LV.intro||'');draw();}
const occ=(e,x,y)=>y===e.y&&x>=e.x&&x<e.x+e.n;
const floor=(x,y)=>M[y]&&(M[y][x]==='.'||M[y][x]==='+');
const entAt=(x,y)=>E.find(e=>occ(e,x,y));
const walkE=e=>WALK.includes(e.k)||((e.k==='dr'||e.k==='st')&&!!doors[e.id]);
const passable=(x,y)=>{if(!floor(x,y))return false;const e=entAt(x,y);return !e||walkE(e);};
const needTxt=e=>e.need.map(g=>g+(bag[g]?' ✓':' ✗')).join(' · ');
const canOpen=e=>e.need.every(g=>bag[g]>0);
function say(s){logs.unshift(s);logs=logs.slice(0,4);}
const sub=s=>' <span class="muted">'+s+'</span>';
function word(e){return active(e.g)?e.full+sub(e.t+' — '+e.m):e.full;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function openQuiz(g){const I=INFO[g],t=I.t;
const pool=I.grp==='la'?Object.values(LAT):I.grp==='mod'?MODP:I.grp==='c'?CONS.map(([,c])=>c+'a'):I.grp==='k'?[...new Set([...CONS.map(([,c])=>c+I.v),...MARK.map(([,v])=>I.ct+v)])]:POOL;
const n=Math.min(4+Math.floor(Math.random()*3),pool.filter(p=>p!==t).length+1);
let ch=[t,...shuffle(pool.filter(p=>p!==t)).slice(0,n-1)];const pt=LA[g]&&LAT[LA[g]];if(pt&&pt!==t&&!ch.includes(pt))ch[ch.length-1]=pt;
quiz={g,choices:shuffle(ch),wrong:new Set()};}
const nearAt=(e,x,y)=>Math.abs(y-e.y)<=1&&x>=e.x-1&&x<=e.x+e.n;
const near=e=>nearAt(e,P.x,P.y);
const isNew=e=>!kn(e.g).seen;
function identify(e){if(e.k==='st'){if(!doors[e.id])openQuiz(e.g);return}if(active(e.g))return;if(e.k==='ch')openQuiz(e.g);else openWordQuiz(e.g);}
function openWordQuiz(g){quiz={type:'w',g,parts:(g.match(AKS)||[g]).map(x=>({p:x,t:tr(x),ok:false})),idx:0};mkChoices();}
function mkChoices(){const pt=quiz.parts[quiz.idx],v=variants(pt.t),n=Math.min(4+Math.floor(Math.random()*3),v.length+1);quiz.choices=shuffle([pt.t,...shuffle(v).slice(0,n-1)]);quiz.wrong=new Set();}
function answerPart(c){const g=quiz.g,k=kn(g),pt=quiz.parts[quiz.idx];
if(c!==pt.t){k.level=0;k.due=0;quiz.wrong.add(c);say(c+' is not '+pt.p+sub('level reset to 0 · try again'));save();draw();return}
pt.ok=true;const nx=quiz.parts.findIndex(x=>!x.ok);if(nx>=0){quiz.idx=nx;mkChoices();draw();return}
k.seen=true;k.due=now()+INT[k.level];const lv=k.level;k.level=Math.min(5,k.level+1);const wi=WINFO[g]||{t:quiz.parts.map(x=>x.t).join(''),m:''};
say(g+' = '+wi.t+sub(wi.m+' · level '+lv+' → '+k.level+' · next review in '+fmt(INT[lv])));quiz=null;speak(g);save();draw();}
function walkBeside(e,then){stopWalk();if(hp<=0)return;if(near(e)){then&&then();draw();return}
const p=pathTo((x,y)=>nearAt(e,x,y));if(!p){say('No way leads to it');draw();return}run(p,then);}
function answer(c){const g=quiz.g,k=kn(g),t=INFO[g].t;
if(c===t){k.seen=true;k.due=now()+INT[k.level];const lv=k.level;k.level=Math.min(5,k.level+1);say(g+' = '+t+sub('correct · level '+lv+' → '+k.level+' · next review in '+fmt(INT[lv])));quiz=null;speak(INFO[g].s);
if(sel&&sel.k==='st'&&sel.g===g&&!doors[sel.id]){doors[sel.id]=true;say('The stone '+g+' rises from the water'+sub('you can step on it'));}else selG=g;}
else{k.level=0;k.due=0;quiz.wrong.add(c);say(c+' is not '+g+sub('level reset to 0 · try again'));}save();draw();}
function move(dx,dy){if(hp<=0)return false;const x=P.x+dx,y=P.y+dy;
if(M[y]&&M[y][x]==='~'){sel=DEEP;learned.add(DEEP.t);say('जलम्'+sub('the water is too deep'));return false;}
if(!floor(x,y)){sel=WALL;learned.add(WALL.t);say('भित्तिः'+sub('bhittiḥ — a wall blocks you'));return false;}
const b=entAt(x,y),was=entAt(P.x,P.y);
if(!b||walkE(b)){P.x=x;P.y=y;
if(b&&(!was||was.k!==b.k)){if(b.k==='wd'){say('You step into the '+word(b));}else if(b.k==='wa')say('You wade through '+word(b));}
return true;}
sel=b;
if(b.k==='lp'){say(word(b)+(active(b.g)?' glows softly':''));}
else if(b.k==='np'){say(word(b)+(active(b.g)?' greets you · नमस्ते':''));}
else if(b.k==='dr'){say(word(b)+' is locked · needs '+b.need.join(' and '));}
else if(b.k==='hz'){const dm=(b.effect&&b.effect.damage)||1;hp-=dm;say(word(b)+' burns you · −'+dm+' HP');}
else if(b.k==='ex'){say(word(b)+' · you descend. Level complete.');}
else{b.hp-=atk;if(b.hp<=0){E=E.filter(e=>e!==b);say('You defeat '+word(b));sel=null;}else{hp--;say('You strike '+word(b)+' · it bites back, −1 HP');}}
if(hp<=0)say('अहम् पतामि — I fall. Restart to try again.');return false;}
function pathTo(goal){const key=(x,y)=>y*W+x,prev=new Map([[key(P.x,P.y),null]]),q=[[P.x,P.y]];
while(q.length){const [x,y]=q.shift();if(goal(x,y)){const r=[];let k=key(x,y);while(prev.get(k)!==null){r.unshift([k%W,Math.floor(k/W)]);k=prev.get(k);}return r;}
for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,nk=key(nx,ny);if(!prev.has(nk)&&passable(nx,ny)){prev.set(nk,key(x,y));q.push([nx,ny]);}}}return null;}
function stopWalk(){if(walk)clearInterval(walk);walk=null;target=null;}
function run(p,then){if(!p.length){then&&then();draw();return}
walk=setInterval(()=>{const [x,y]=p.shift();const ok=move(x-P.x,y-P.y);if(!ok){stopWalk();draw();return}if(!p.length){stopWalk();then&&then();}draw();},90);draw();}
function walkTo(tx,ty){stopWalk();if(hp<=0||(tx===P.x&&ty===P.y)){draw();return}if(!passable(tx,ty)){draw();return}
const p=pathTo((x,y)=>x===tx&&y===ty);if(!p){say('No way leads there');draw();return}target=[tx,ty];run(p);}
function approach(e){stopWalk();if(hp<=0)return;const adj=(x,y)=>[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>occ(e,x+dx,y+dy));
const p=pathTo(adj);if(!p){say('No way leads to '+e.full);draw();return}
run(p,()=>{for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])if(occ(e,P.x+dx,P.y+dy)){move(dx,dy);break}});}
function pickup(e,el){const g=e.g,root=document.getElementById('root').getBoundingClientRect(),a=el.getBoundingClientRect();
if(e.k==='it'){E=E.filter(x=>x!==e);sel=null;selG=null;draw();}
const chip=document.querySelector('.chip[data-g="'+g+'"]')||document.getElementById('bag'),b=chip.getBoundingClientRect();
const f=document.createElement('div');f.className='fly '+e.k+(e.cls?' ent '+e.cls:'');f.textContent=g;
Object.assign(f.style,{left:(a.left-root.left)+'px',top:(a.top-root.top)+'px',width:a.width+'px',height:a.height+'px'});
document.getElementById('root').appendChild(f);
const tx=(chip.classList.contains('chip')?b.left:b.left+8)-a.left,ty=b.top-a.top;
requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform='translate('+tx+'px,'+ty+'px) scale(.8)';f.style.opacity='0.6';}));
setTimeout(()=>{f.remove();bag[g]=(bag[g]||0)+1;
if(e.k==='it'){const f=e.effect||{};if(f.hp)hp+=f.hp;if(f.atk)atk=Math.max(atk,f.atk);}
save();say('You pick up '+g+sub(e.t+(e.fx?' · '+e.fx:'')+' · '+bag[g]+' in the bag'));draw();const c=document.querySelector('.chip[data-g="'+g+'"]');if(c)c.classList.add('pop');},650);}
const ACT={open:['lock-open','Open'],pick:['hand-grab','Pick up'],go:['walk','Go there'],near:['walk','Go closer'],id:['eye','Identify']};
const act=a=>a?'<button data-act="'+a+'" style="float:right;margin:-2px 0 4px 8px;font-size:13px;padding:3px 10px"><i class="ti ti-'+ACT[a][0]+'" aria-hidden="true"></i> '+ACT[a][1]+'</button>':'';
const unknownInfo=e=>act(near(e)?'id':'near')+'<span style="font-weight:500">'+e.g+'</span>'+sub('· unknown'+(e.k==='ch'?' akṣara':'')+' · '+(near(e)?'you are beside it':'go beside it to identify'));
function draw(){let h='';const t=performance.now()/1000;
const cx=Math.max(0,Math.min(W-VW,ED.on&&ED.cam?ED.cam.x:P.x-7)),cy=Math.max(0,Math.min(H-VH,ED.on&&ED.cam?ED.cam.y:P.y-6));ED.cx=cx;ED.cy=cy;
for(let vy=0;vy<VH;vy++)for(let vx=0;vx<VW;vx++){const x=cx+vx,y=cy+vy,pos='grid-column:'+(vx+1)+';grid-row:'+(vy+1);
if(M[y][x]==='#')h+='<div class="c w" data-w="1" style="'+pos+'">भ</div>';
else if(M[y][x]==='~'){const [a,n]=DWB[y*W+x];if(x===a||vx===0){const en=Math.min(a+n,cx+VW);h+='<div class="c dw" data-dw="1" style="grid-column:'+(vx+1)+' / span '+(en-x)+';grid-row:'+(vy+1)+'"><span style="animation-delay:'+(-((t+a*0.37+y*0.61)%2.1)).toFixed(2)+'s">'+(n>1?'जलम्':'ज')+'</span></div>';}}
else{const tg=target&&target[0]===x&&target[1]===y&&!entAt(x,y);h+='<div class="c f'+(tg?' tg':'')+'" data-x="'+x+'" data-y="'+y+'" style="'+pos+'">'+(tg?'◎':M[y][x]==='+'?'▫':'·')+'</div>';}}
E.forEach((e,i)=>{if(e.y<cy||e.y>=cy+VH)return;const s=Math.max(e.x,cx),en=Math.min(e.x+e.n,cx+VW);if(en<=s)return;
const du=DUR[e.k],dl=du?-((t+(e.d||0))%du):0;
h+='<div class="c ent '+e.k+(e.cls?' '+e.cls:'')+(e.k==='ch'&&active(e.g)?' ok':'')+(e.k==='dr'&&doors[e.id]?' open':'')+(e.k==='st'&&doors[e.id]?' open':'')+(e.k!=='ch'&&e.k!=='st'&&!active(e.g)?' unk':'')+(e===sel?' sel':'')+'" data-id="'+i+'" data-s="'+s+'" style="'+(e.cls==='divine'?'--dl:'+(-((t+(e.d||0))%2.4)).toFixed(2)+'s;':'')+'grid-column:'+(s-cx+1)+' / span '+(en-s)+';grid-row:'+(e.y-cy+1)+'"><span style="animation-delay:'+dl.toFixed(2)+'s">'+e.g+'</span></div>';});
h+='<div class="c ent pl'+(sel===P?' sel':'')+'" data-p="1" style="grid-column:'+(P.x-cx+1)+';grid-row:'+(P.y-cy+1)+'">अ</div>';
document.getElementById('map').innerHTML=h;
document.getElementById('hp').textContent='♥ '+hp;document.getElementById('sc').textContent=Object.values(K).filter(k=>k.seen).length;
const gs=Object.keys(bag);
document.getElementById('bag').innerHTML=gs.length?gs.map(g=>{if(!INFO[g]&&!K[g])return '<span class="chip item" data-g="'+g+'"><span class="g">'+g+'</span>×'+bag[g]+'</span>';const k=kn(g),a=active(g);return '<span class="chip'+(INFO[g]?'':' item')+(a?'':' fg')+'" data-g="'+g+'"><span class="g">'+g+'</span>×'+bag[g]+' <span class="muted" style="font-size:12px">'+(a?'L'+k.level:'<i class="ti ti-refresh" aria-label="forgotten"></i>')+'</span></span>';}).join(''):'<span style="font-size:13px;color:var(--text-muted)">Empty</span>';
const inf=document.getElementById('info');
if(quiz&&quiz.type==='w'){const q=quiz;inf.innerHTML='<div style="margin-bottom:8px">Read <span style="font-size:18px;font-weight:500">'+q.g+'</span>'+sub('tap each part · level '+kn(q.g).level)+'</div><div class="row" style="margin-bottom:8px">'+q.parts.map((x,i)=>'<button class="qp'+(i===q.idx?' cur':'')+(x.ok?' done':'')+'" data-part="'+i+'"><span style="font-size:17px">'+x.p+'</span><br><span style="font-size:12px">'+(x.ok?x.t:'?')+'</span></button>').join('')+'</div><div class="row">'+q.choices.map(c=>'<button class="qb'+(q.wrong.has(c)?' no':'')+'" data-c="'+c+'">'+c+'</button>').join('')+'</div>';}
else if(quiz){inf.innerHTML='<div style="margin-bottom:8px">Transliterate <span style="font-size:18px;font-weight:500">'+quiz.g+'</span>'+sub('level '+kn(quiz.g).level)+'</div><div class="row">'+quiz.choices.map(c=>'<button class="qb'+(quiz.wrong.has(c)?' no':'')+'" data-c="'+c+'">'+c+'</button>').join('')+'</div>';}
else if(selG&&INFO[selG]&&sel&&sel.k==='ch'&&E.includes(sel)&&isNew(sel)){inf.innerHTML=unknownInfo(sel);}
else if(selG&&INFO[selG]){const k=kn(selG),a=active(selG),onMap=sel&&sel.k==='ch'&&sel.g===selG&&E.includes(sel);
inf.innerHTML=act(onMap&&a?(near(sel)?'pick':'near'):'')+'<span style="font-weight:500">'+selG+' = '+INFO[selG].t+'</span>'+sub('· '+INFO[selG].m+' · level '+k.level+' · '+(a?'review in '+fmt(k.due-now()):'forgotten, tap to review'));}
else if(selG&&WINFO[selG]){const k=kn(selG),a=active(selG);inf.innerHTML='<span style="font-weight:500">'+selG+'</span>'+sub('· '+(a?WINFO[selG].t+' — '+WINFO[selG].m+' · level '+k.level+' · review in '+fmt(k.due-now()):'forgotten, tap to review')+(bag[selG]?' · in your bag':''));}
else if(sel&&sel.k==='st'&&E.includes(sel)){inf.innerHTML=doors[sel.id]?'<span style="font-weight:500">'+sel.g+' = '+INFO[sel.g].t+'</span>'+sub('· stepping stone · open'):act(near(sel)?'id':'near')+'<span style="font-weight:500">'+sel.g+'</span>'+sub('· stepping stone · '+(near(sel)?'decipher it to step on it':'go beside it to decipher it'));}
else if(sel&&E.includes(sel)&&isNew(sel)){inf.innerHTML=unknownInfo(sel);}
else if(sel&&E.includes(sel)&&!active(sel.g)){inf.innerHTML=act('id')+'<span style="font-weight:500">'+sel.full+'</span>'+sub('· forgotten · identify it again');}
else if(sel&&(sel===WALL||sel===DEEP||sel===P||E.includes(sel))){const u=sel===P?entAt(P.x,P.y):null;
const hint=sel.k==='dr'?(doors[sel.id]?' · open':' · locked · needs '+needTxt(sel)):({tr:' · walkable, can’t be picked up',wa:' · walkable, can’t be picked up',wd:' · walkable',sg:' · a sign'}[sel.k]||'');
const a=sel.k==='dr'?(doors[sel.id]?'':near(sel)?(canOpen(sel)?'open':''):'near'):({it:near(sel)?'pick':'near',en:'go',hz:'go',ex:'go'}[sel.k]||'');
const lvl=E.includes(sel)?' · level '+kn(sel.g).level+' · review in '+fmt(kn(sel.g).due-now()):'';
inf.innerHTML=act(a)+'<span style="font-weight:500">'+(sel.n===1?sel.g+' = '+sel.full:sel.full)+'</span>'+sub('· '+sel.t+' — '+sel.m+hint+lvl+(u?' · standing on '+u.full:''));}
else inf.innerHTML='<span style="color:var(--text-muted)">Tap a word to read it, the floor to walk</span>';
document.getElementById('log').innerHTML=logs.map((l,i)=>'<div style="color:'+(i?'var(--text-secondary)':'var(--text-primary)')+'">'+l+'</div>').join('');
if(SHOW_MINI)mini(cx,cy);save();}
function mini(){}
const cellOf=(c,e,ev)=>{const r=c.getBoundingClientRect();return +c.dataset.s+Math.min(e.n-1,Math.floor((ev.clientX-r.left)/24));};
document.getElementById('map').addEventListener('click',ev=>{
if(ED.on){editClick(ev);return}
if(ev.target.closest('[data-p]')){sel=P;selG=null;quiz=null;speak('अहम्');draw();return}
if(ev.target.closest('[data-dw]')){sel=DEEP;selG=null;quiz=null;speakIfKnown(DEEP);learned.add(DEEP.t);draw();return}
if(ev.target.closest('[data-w]')){sel=WALL;selG=null;quiz=null;speakIfKnown(WALL);learned.add(WALL.t);draw();return}
const c=ev.target.closest('[data-id]');if(c){const e=E[+c.dataset.id];const keepQuiz=quiz&&quiz.g===e.g;
const walkOn=e.k==='tr'||e.k==='wa'||e.k==='wd'||e.k==='sg'||((e.k==='dr'||e.k==='st')&&doors[e.id]);
if(sel===e&&!walkOn&&!near(e)){walkBeside(e,()=>{sel=e;selG=e.k==='ch'?e.g:null;identify(e);});return}
if(e.k==='st'&&!doors[e.id]){sel=e;selG=null;if(!keepQuiz)quiz=null;if(near(e)&&!keepQuiz)openQuiz(e.g);draw();return}
sel=e;selG=e.k==='ch'?e.g:null;if(!keepQuiz)quiz=null;
if(isNew(e)){if(near(e)&&!keepQuiz)identify(e);}
else{speakIfKnown(e);if(!keepQuiz)identify(e);}
if(walkOn){walkTo(cellOf(c,e,ev),e.y);return}
draw();return}
const f=ev.target.closest('[data-x]');if(f){selG=null;quiz=null;walkTo(+f.dataset.x,+f.dataset.y);}});
document.getElementById('info').addEventListener('click',ev=>{const b=ev.target.closest('[data-c]');if(b&&quiz){if(quiz.type==='w')answerPart(b.dataset.c);else answer(b.dataset.c);return}
const pp=ev.target.closest('[data-part]');if(pp&&quiz&&quiz.type==='w'){const i=+pp.dataset.part;if(!quiz.parts[i].ok){quiz.idx=i;mkChoices();draw();}return}
const a=ev.target.closest('[data-act]');if(!a||!sel||!E.includes(sel))return;
if(a.dataset.act==='go'){approach(sel);return}
if(a.dataset.act==='near'){const e=sel;walkBeside(e,()=>{sel=e;selG=e.k==='ch'?e.g:null;identify(e);});return}
if(a.dataset.act==='id'){identify(sel);draw();return}
if(a.dataset.act==='open'){const d=sel;if(!near(d)||!canOpen(d)){draw();return}d.need.forEach(g=>{bag[g]--;if(!bag[g])delete bag[g];});doors[d.id]=true;speak(d.full);say('You open the '+d.full+sub(d.t+' · used '+d.need.join(' and ')+' · it stays open'));save();draw();return}
if(!near(sel)){draw();return}const tile=document.querySelector('#map [data-id="'+E.indexOf(sel)+'"]');pickup(sel,tile||a);});
document.getElementById('bag').addEventListener('click',ev=>{const c=ev.target.closest('[data-g]');if(!c)return;const g=c.dataset.g;sel=null;selG=g;
quiz=null;if(INFO[g]){if(active(g))speak(INFO[g].s);else openQuiz(g);}else if(K[g]){if(active(g))speak(g);else openWordQuiz(g);}draw();});
document.querySelectorAll('.tw').forEach(b=>b.onclick=()=>{warp+=+b.dataset.t;save();say('Time passes · +'+fmt(+b.dataset.t));draw();});
document.getElementById('voice').addEventListener('change',ev=>{voiceName=ev.target.value;save();
if(selG&&INFO[selG]){if(active(selG))speak(INFO[selG].s);}else if(sel&&(sel===P||sel===WALL||E.includes(sel)))speakIfKnown(sel);});
document.addEventListener('keydown',ev=>{const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[ev.key];if(k&&ED.on&&!/INPUT|SELECT/.test(document.activeElement.tagName)){ev.preventDefault();pan(k[0]*3,k[1]*3);return}if(k){ev.preventDefault();stopWalk();move(...k);draw();}});
function showLevel(){document.getElementById('lvname').textContent=LV.title||LV.id||'';document.getElementById('bi').style.display=LV===BUILTIN?'none':'';}
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify(LV,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(LV.id||'level')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
const ED={on:false,cam:null,cx:0,cy:0};
const EDT=[
['t','#','Wall भ'],['t','.','Floor'],['t','+','Doorway'],['t','~','Deep water जलम्'],['start','','Player start अ'],
['e',{g:'वनम्',n:2,k:'wd',t:'vanam',m:'wood, a whole region of trees'},'Wood वनम्'],['e',{g:'वृक्षः',n:2,k:'tr',t:'vṛkṣaḥ',m:'tree'},'Tree वृक्षः'],
['e',{g:'जलम्',n:2,k:'wa',t:'jalam',m:'water'},'Water जलम्'],['e',{g:'अग्निः',n:2,k:'hz',t:'agniḥ',m:'fire',effect:{damage:1}},'Fire अग्निः'],
['e',{g:'दीपः',n:2,k:'lp',t:'dīpaḥ',m:'lamp'},'Lamp दीपः'],['e',{g:'फलम्',n:2,k:'it',t:'phalam',m:'fruit',fx:'+1 HP',effect:{hp:1}},'Fruit फलम्'],
['e',{g:'पुष्पम्',n:2,k:'it',t:'puṣpam',m:'flower'},'Flower पुष्पम्'],['e',{g:'सर्पः',n:2,k:'en',t:'sarpaḥ',m:'snake',hp:2},'Snake सर्पः'],
['e',{g:'सिंहः',n:2,k:'en',t:'siṃhaḥ',m:'lion',hp:3},'Lion सिंहः'],['e',{g:'नरः',n:2,k:'np',t:'naraḥ',m:'man'},'Person नरः'],
['e',{g:'सोपानम्',n:3,k:'ex',t:'sopānam',m:'stairs'},'Stairs सोपानम्'],['ch','','Akṣara (pick letter) …'],['st','','Stepping stone (pick letter) …']];
function fillEditor(){const t=document.getElementById('edtype');t.innerHTML=EDT.map((d,i)=>'<option value="'+i+'">'+d[2]+'</option>').join('');
const l=document.getElementById('edletter');l.innerHTML=Object.keys(INFO).map(g=>'<option value="'+g+'">'+g+'</option>').join('');}
function edMsg(m){document.getElementById('edmsg').innerHTML=m;}
function editedLevel(){if(LV===BUILTIN){LV=JSON.parse(JSON.stringify(BUILTIN));if(!/edited/.test(LV.title||''))LV.title=(LV.title||'level')+' · edited';LV.id=(LV.id||'level')+'-edited';}
LV.map.rows=M.map(r=>r.join(''));try{localStorage.setItem('skt-rogue-level',JSON.stringify(LV));}catch(e){}showLevel();}
const sameE=(a,b)=>a.x===b.x&&a.y===b.y&&a.k===b.k&&a.g===b.g;
function removeEnt(e){E=E.filter(x=>x!==e);if(LV===BUILTIN)editedLevel();const i=LV.entities.findIndex(x=>sameE(x,e));if(i>=0)LV.entities.splice(i,1);if(sel===e)sel=null;}
function cellFromEvent(ev){const mp=document.getElementById('map'),r=mp.getBoundingClientRect(),left=r.left+(r.width-VW*24)/2;
return [ED.cx+Math.floor((ev.clientX-left)/24),ED.cy+Math.floor((ev.clientY-r.top)/28)];}
function editClick(ev){const [x,y]=cellFromEvent(ev);editAt(x,y);}
function editAt(x,y){if(x<0||y<0||x>=W||y>=H)return;const tool=document.querySelector('input[name=edtool]:checked').value;const e=entAt(x,y);
if(tool==='del'){if(e){removeEnt(e);edMsg('Deleted '+e.g);}else if(M[y][x]!=='.'){if(x===0||y===0||x===W-1||y===H-1){edMsg('The outer wall stays');}else{M[y][x]='.';computeDWB();edMsg('Cleared field '+x+','+y);}}else edMsg('Nothing to delete at '+x+','+y);editedLevel();quiz=null;draw();return}
const d=EDT[+document.getElementById('edtype').value];const isP=(px,py)=>px===P.x&&py===P.y;
if(d[0]==='t'){if(isP(x,y)&&(d[1]==='#'||d[1]==='~')){edMsg('Move the player first');return}if(d[1]!=='.'&&e)removeEnt(e);M[y][x]=d[1];computeDWB();edMsg(d[2]+' at '+x+','+y);}
else if(d[0]==='start'){if(!floor(x,y)){edMsg('The start must be on floor');return}editedLevel();LV.start={x,y};P.x=x;P.y=y;edMsg('Player start set to '+x+','+y);}
else{let o;if(d[0]==='e')o=JSON.parse(JSON.stringify(d[1]));else{const g=document.getElementById('edletter').value;o=d[0]==='ch'?{g,n:1,k:'ch',t:INFO[g].t,m:INFO[g].m}:{g,n:1,k:'st',id:'s'+x+'_'+y,t:INFO[g].t,m:'stepping stone'};}
for(let i=0;i<o.n;i++){if(!floor(x+i,y)||entAt(x+i,y)||isP(x+i,y)){edMsg('No room for '+o.g+' at '+x+','+y+' (needs '+o.n+' free floor fields)');return}}
o.x=x;o.y=y;editedLevel();LV.entities.push(JSON.parse(JSON.stringify(o)));o.full=o.full||o.g;E.push(o);
if(o.k!=='ch'&&o.k!=='st')WINFO[o.g]={t:o.t,m:o.m};if(o.k==='it')IINFO[o.g]={t:o.t,m:o.m};edMsg('Placed '+o.g+' at '+x+','+y);}
editedLevel();draw();}
function pan(dx,dy){ED.cam={x:Math.max(0,Math.min(W-VW,ED.cx+dx)),y:Math.max(0,Math.min(H-VH,ED.cy+dy))};draw();edPos();}
function edPos(){document.getElementById('edpos').textContent='view '+ED.cx+','+ED.cy;}
document.getElementById('edon').onchange=ev=>{ED.on=ev.target.checked;document.getElementById('edtools').style.display=ED.on?'':'none';document.getElementById('map').style.cursor=ED.on?'crosshair':'';
stopWalk();quiz=null;if(ED.on){ED.cam={x:ED.cx,y:ED.cy};fillEditor();edMsg('Tap fields on the map to draw or delete');}draw();edPos();};
document.getElementById('edtype').onchange=ev=>{const d=EDT[+ev.target.value];document.getElementById('edletter').style.display=(d[0]==='ch'||d[0]==='st')?'':'none';};
document.querySelectorAll('[data-pan]').forEach(b=>b.onclick=()=>{const [a,c]=b.dataset.pan.split(',').map(Number);pan(a,c);});
function useLevel(L,store){LV=L;try{if(store)localStorage.setItem('skt-rogue-level',JSON.stringify(L));else localStorage.removeItem('skt-rogue-level');}catch(e){}applyLevel(LV);showLevel();init();}
document.getElementById('ld').onchange=ev=>{const f=ev.target.files[0];const er=document.getElementById('lderr');er.textContent='';if(!f)return;f.text().then(t=>{let L;try{L=JSON.parse(t);}catch(e){er.textContent='That file isn’t valid JSON.';return}
if(!L.map||!Array.isArray(L.map.rows)||!Array.isArray(L.entities)||!L.start||!L.letters||!L.kinds){er.textContent='That JSON isn’t a level file (needs map, start, kinds, letters and entities).';return}
useLevel(L,true);}).finally(()=>{ev.target.value='';});};
document.getElementById('bi').onclick=()=>useLevel(BUILTIN,false);
document.getElementById('rs').onclick=()=>{K={};bag={};warp=0;learned=new Set();doors={};save();init();};
setInterval(()=>{if(!walk)draw();},15000);
load();showLevel();
if(hasTTS){listVoices();speechSynthesis.onvoiceschanged=listVoices;}else{document.getElementById('voice').innerHTML='<option value="">Off</option><option disabled>Speech not supported here</option>';}
init();
</script>
</body>
